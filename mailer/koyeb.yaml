# Deploy: https://app.koyeb.com — free Nano instance, usually no card.
# Connect GitHub branch `mailer-pages`, root directory `mailer`, Docker build.
#
# Required env / secrets on Koyeb:
#   GMAIL_ADDRESS
#   GMAIL_APP_PASSWORD
#   API_KEY          (pick any long secret; enter same in phone UI once, or leave blank for open)
#   CORS_ORIGINS=*

name: mailer-desk
service:
  type: web
  routes:
    - path: /
  ports:
    - port: 8000
      protocol: http
  env:
    - key: PORT
      value: "8000"
    - key: FRONTEND_DIR
      value: /app/frontend
    - key: DATA_DIR
      value: /app/data
    - key: CORS_ORIGINS
      value: "*"
